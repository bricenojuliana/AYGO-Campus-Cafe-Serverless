<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Café</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Campus Café</h1>
    <p id="api-status" class="muted" role="status"></p>
  </header>

  <main class="layout">
    <section class="panel" aria-labelledby="menu-title">
      <h2 id="menu-title">Menu</h2>
      <p id="menu-message" class="message" role="status"></p>
      <ul id="menu" class="menu"></ul>
    </section>

    <section class="panel" aria-labelledby="cart-title">
      <div id="confirmation" class="confirmation" hidden>
        <p id="confirmation-title" class="confirmation-title"></p>
        <p class="muted">Your order code</p>
        <div class="code-row">
          <span id="confirmation-code" class="order-code big"></span>
          <button id="confirmation-copy" type="button" class="copy">Copy</button>
        </div>
        <ul id="confirmation-items" class="order-items"></ul>
        <p class="confirmation-total">Total <strong id="confirmation-total"></strong></p>
        <p class="hint">Show this code when you pick up your order.</p>
        <button id="new-order" type="button" class="primary">Start a new order</button>
      </div>

      <div id="cart-area">
        <h2 id="cart-title">Your cart</h2>
        <ul id="cart" class="cart"></ul>
        <p id="cart-empty" class="muted">Add products from the menu.</p>
        <div class="cart-footer">
          <p>Estimated total <strong id="cart-total">—</strong></p>
          <p class="hint">The final price is set by the server from the current menu.</p>
          <button id="submit-order" type="button" class="primary" disabled>Place order</button>
        </div>
      </div>
      <p id="submit-message" class="message" role="status"></p>
    </section>

    <section class="panel wide" aria-labelledby="orders-title">
      <h2 id="orders-title">Orders</h2>
      <form id="lookup-form" class="lookup">
        <label for="lookup-id">Find an order by code</label>
        <div class="row">
          <input id="lookup-id" name="orderId" autocomplete="off" spellcheck="false"
                 placeholder="CC-XXXX-XXXX" maxlength="20" required>
          <button type="submit">Find</button>
        </div>
      </form>
      <p id="orders-message" class="message" role="status"></p>
      <button id="show-all" type="button" class="link" hidden>Show all orders</button>
      <ul id="orders" class="orders"></ul>
    </section>
  </main>

  <template id="menu-item">
    <li class="menu-item">
      <div>
        <span class="name"></span>
        <span class="price"></span>
      </div>
      <button type="button" class="add">Add</button>
    </li>
  </template>

  <template id="cart-item">
    <li class="cart-item">
      <span class="name"></span>
      <div class="qty">
        <button type="button" class="dec" aria-label="Decrease quantity">−</button>
        <span class="count" aria-live="polite"></span>
        <button type="button" class="inc" aria-label="Increase quantity">+</button>
      </div>
      <span class="line-total"></span>
      <button type="button" class="remove link">Remove</button>
    </li>
  </template>

  <template id="order-card">
    <li class="order-card">
      <div class="order-head">
        <div class="code-row">
          <span class="order-code"></span>
          <button type="button" class="copy small">Copy</button>
        </div>
        <span class="badge"></span>
      </div>
      <ul class="order-items"></ul>
      <div class="order-foot">
        <span class="total"></span>
        <span class="muted dates"></span>
      </div>
      <div class="order-actions">
        <button type="button" class="refresh">Refresh</button>
        <button type="button" class="cancel danger">Cancel order</button>
        <button type="button" class="forget link">Remove from list</button>
      </div>
      <p class="message order-message" role="status"></p>
    </li>
  </template>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
